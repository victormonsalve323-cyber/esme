<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Esmeralda 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Título principal en la parte superior -->
    <h1 class="main-title">Esmeralda</h1>

    <!-- Canvas para la esfera y el corazón -->
    <canvas id="canvas"></canvas>

    <!-- Corazones flotantes de fondo -->
    <div class="floating-heart" style="top: 15%; left: 5%;">💖</div>
    <div class="floating-heart" style="top: 22%; right: 8%;">💗</div>
    <div class="floating-heart" style="top: 48%; left: 3%;">💕</div>
    <div class="floating-heart" style="top: 62%; right: 5%;">❤️</div>
    <div class="floating-heart" style="top: 75%; left: 8%;">✨</div>
    <div class="floating-heart" style="top: 80%; right: 10%;">💖</div>

    <!-- Frases del lado IZQUIERDO -->
    <div class="floating-text" style="top: 18%; left: 6%;">Eres mi vida 💖</div>
    <div class="floating-text" style="top: 32%; left: 4%;">Mi universo ✨</div>
    <div class="floating-text" style="top: 48%; left: 5%;">Me haces feliz 🌸</div>
    <div class="floating-text" style="top: 64%; left: 3%;">Mi persona favorita 💫</div>
    <div class="floating-text" style="top: 80%; left: 7%;">Mi lugar seguro 🏠</div>

    <!-- Frases del lado DERECHO -->
    <div class="floating-text" style="top: 20%; right: 6%;">Te amo infinitamente 💗</div>
    <div class="floating-text" style="top: 36%; right: 4%;">Siempre juntos 👩‍❤️‍👨</div>
    <div class="floating-text" style="top: 52%; right: 5%;">Eres mi mundo 🌍</div>
    <div class="floating-text" style="top: 68%; right: 3%;">Gracias por existir 🌹</div>
    <div class="floating-text" style="top: 82%; right: 8%;">Para siempre tú y yo 🔐</div>

    <!-- Editor CSS flotante abajo -->
    <div class="code-editor">
        <div class="editor-header">
            <div class="dots">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <span class="filename">Style.css</span>
        </div>
        <hr class="divider">
        <pre><code id="typewriter"></code></pre>
    </div>

    <script src="script.js"></script>
</body>
</html>
